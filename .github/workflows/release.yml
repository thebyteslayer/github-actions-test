name: CI Build Matrix

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        module: [cli, daemon, webui]
        target:
          - linux-amd64
          - linux-arm64
          - darwin-arm64
          - windows-amd64
          - windows-arm64
          - bundle

        exclude:
          - module: cli
            target: bundle
          - module: daemon
            target: bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Toolchain (global)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # -------------------------
      # WebUI deps only
      # -------------------------
      - name: Setup Bun
        if: matrix.module == 'webui'
        uses: oven-sh/setup-bun@v2

      - name: Install WebUI deps
        if: matrix.module == 'webui'
        working-directory: services/web-ui
        shell: bash
        run: bun install

      # -------------------------
      # Build
      # -------------------------
      - name: Run CI build
        shell: bash
        run: |
          python ci.py --verbose \
            --module ${{ matrix.module }} \
            --target ${{ matrix.target }}

      # -------------------------
      # Debug artifacts
      # -------------------------
      - name: Show artifacts
        run: ls -R artifacts || true

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for release metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # -------------------------
      # Flatten directories → files only
      # -------------------------
      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      # -------------------------
      # Create GitHub Release
      # -------------------------
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          prerelease: false

          # GitHub-generated release notes
          generateReleaseNotes: true

          # optional quality-of-life
          makeLatest: true

          # only files, never folders
          artifacts: "release_files/*"

          token: ${{ secrets.GITHUB_TOKEN }}