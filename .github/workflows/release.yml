name: Version Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          # CLI
          - module: cli
            target: linux-amd64
          - module: cli
            target: linux-arm64
          - module: cli
            target: windows-amd64
          - module: cli
            target: windows-arm64
          - module: cli
            target: darwin-arm64

          # Daemon
          - module: daemon
            target: linux-amd64
          - module: daemon
            target: linux-arm64

          # WebUI
          - module: webui
            target: linux-amd64
          - module: webui
            target: bundle

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        if: matrix.module == 'webui'

      - name: Install WebUI dependencies
        if: matrix.module == 'webui'
        working-directory: services/web-ui
        run: bun install

      - name: Run CI (verbose)
        run: |
          set -e

          if [[ "${{ matrix.module }}" == "webui" ]]; then
            cd services/web-ui
            python ../../ci.py \
              --module ${{ matrix.module }} \
              --target ${{ matrix.target }} \
              --verbose | tee ci_output.txt
          else
            python ci.py \
              --module ${{ matrix.module }} \
              --target ${{ matrix.target }} \
              --verbose | tee ci_output.txt
          fi

      - name: Validate artifacts exist
        run: |
          if [[ ! -d artifacts ]]; then
            echo "ERROR: artifacts folder missing"
            exit 1
          fi

          ls -R artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target }}
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Inspect artifacts
        run: ls -R all-artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "all-artifacts/**"
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}