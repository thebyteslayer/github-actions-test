name: CI Build Matrix

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Opt into future Node runtime early (removes warnings)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        module: [cli, daemon, webui]
        target:
          - linux-amd64
          - linux-arm64
          - darwin-arm64
          - windows-amd64
          - windows-arm64
          - bundle

        exclude:
          - module: cli
            target: bundle
          - module: daemon
            target: bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # -------------------------
      # Toolchains (latest)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go (no cache)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      # -------------------------
      # WebUI only
      # -------------------------
      - name: Setup Bun
        if: matrix.module == 'webui'
        uses: oven-sh/setup-bun@v2

      - name: Install WebUI deps
        if: matrix.module == 'webui'
        working-directory: services/web-ui
        run: bun install

      # -------------------------
      # Build
      # -------------------------
      - name: Run CI build
        shell: bash
        run: |
          python ci.py --verbose \
            --module ${{ matrix.module }} \
            --target ${{ matrix.target }}

      # -------------------------
      # Debug output (optional)
      # -------------------------
      - name: List artifacts
        run: ls -R artifacts || true

      # -------------------------
      # Upload artifacts (fast, no compression)
      # -------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for GitHub release context)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # -------------------------
      # Flatten everything (required for release-action)
      # -------------------------
      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      # -------------------------
      # Create GitHub Release (auto notes)
      # -------------------------
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          prerelease: false

          # clean GitHub-generated changelog
          generateReleaseNotes: true

          # only files, no folders
          artifacts: "release_files/*"

          token: ${{ secrets.GITHUB_TOKEN }}