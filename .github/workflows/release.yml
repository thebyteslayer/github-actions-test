name: CI Build Matrix

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        module: [cli, daemon, webui]
        target:
          - name: linux-amd64
            runner: ubuntu-latest

          - name: linux-arm64
            runner: ubuntu-24.04-arm

          - name: darwin-arm64
            runner: macos-14

          - name: windows-amd64
            runner: windows-latest

          - name: windows-arm64
            runner: windows-11-arm

          - name: bundle
            runner: ubuntu-latest

        exclude:
          # bundle only exists for webui → removes 10 invalid combos
          - module: cli
            target: { name: bundle, runner: ubuntu-latest }
          - module: daemon
            target: { name: bundle, runner: ubuntu-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bun only needed for webui builds
      - name: Setup Bun
        if: matrix.module == 'webui'
        uses: oven-sh/setup-bun@v2

      - name: Install webui dependencies
        if: matrix.module == 'webui'
        working-directory: services/webui
        shell: bash
        run: |
          bun install

      - name: Run CI build
        shell: bash
        run: |
          python ci.py --verbose \
            --module ${{ matrix.module }} \
            --target ${{ matrix.target.name }}

      - name: List artifacts
        shell: bash
        run: |
          ls -R artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.target.name }}
          path: artifacts/**