name: Release on Tag

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (web-ui)
        working-directory: services/web-ui
        run: bun install

      - name: Run CI script
        id: ci
        run: |
          python ci.py | tee ci_output.txt

      - name: Check CI result
        id: check
        run: |
          last_line=$(tail -n 1 ci_output.txt)
          echo "Last line: $last_line"

          # Extract numbers using regex
          success_count=$(echo "$last_line" | grep -oE '[0-9]+ successful' | grep -oE '[0-9]+')
          fail_count=$(echo "$last_line" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')

          echo "Parsed: success=$success_count fail=$fail_count"

          if [[ "$success_count" -eq 16 && "$fail_count" -eq 0 ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Create GitHub Release and upload artifacts
        if: steps.check.outputs.success == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}