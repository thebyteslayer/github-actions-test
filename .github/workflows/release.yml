name: Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (web-ui)
        working-directory: services/web-ui
        run: bun install

      - name: Run CI script
        id: ci
        run: |
          python ci.py | tee ci_output.txt